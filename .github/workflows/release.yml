name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: flutter_alive-linux-x64
            output: flutter_alive
          - os: macos-13
            artifact: flutter_alive-macos-x64
            output: flutter_alive
          - os: macos-14
            artifact: flutter_alive-macos-arm64
            output: flutter_alive
          - os: windows-latest
            artifact: flutter_alive-windows-x64
            output: flutter_alive.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart compile exe bin/flutter_alive.dart -o ${{ matrix.output }}
      - name: Create checksum
        if: runner.os != 'Windows'
        run: shasum -a 256 ${{ matrix.output }} > ${{ matrix.output }}.sha256
      - name: Create checksum on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash ${{ matrix.output }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.output }}" | Out-File -Encoding ascii "${{ matrix.output }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256

  vscode-extension:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_alive_vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/flutter_alive_vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run compile
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-alive-vscode
          path: packages/flutter_alive_vscode/*.vsix

  github-release:
    needs: [binaries, vscode-extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --force
